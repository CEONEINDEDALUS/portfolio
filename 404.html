<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found • Ceonein Dedalus</title>
  <meta name="description" content="The page you are looking for does not exist.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0A0A0B">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <style>
    :root {
      --bg: #0A0A0B;
      --fg: #FFFFFF;
      --muted: #9A9A9A;
      --blue: #4B7BFF;
      --line: rgba(255, 255, 255, .18);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: ui-monospace, 'SFMono-Regular', 'Cascadia Code', 'JetBrains Mono', Consolas, monospace;
    }

    main {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: clamp(1.5rem, 6vw, 6rem);
    }

    .code {
      margin: 0 0 1.5rem;
      color: var(--muted);
      font-size: .8rem;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-family: 'Dennis Sans', ui-monospace, monospace;
      font-size: clamp(3rem, 12vw, 9rem);
      font-weight: 500;
      line-height: .95;
      letter-spacing: -.04em;
    }

    h1 span {
      color: var(--blue);
    }

    .lede {
      max-width: 28rem;
      margin: 1.5rem 0 3rem;
      color: var(--muted);
      font-size: clamp(.95rem, 2vw, 1.15rem);
      line-height: 1.7;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: .75rem;
    }

    nav a {
      display: inline-block;
      border: 1px solid var(--line);
      color: var(--fg);
      text-decoration: none;
      padding: .9em 1.4em;
      font-size: .75rem;
      letter-spacing: .1em;
      text-transform: uppercase;
      transition: border-color .25s ease, background .25s ease;
    }

    nav a:hover,
    nav a:focus-visible {
      border-color: var(--blue);
      background: rgba(255, 255, 255, .04);
    }

    nav a:focus-visible {
      outline: 2px solid var(--blue);
      outline-offset: 3px;
    }

    .foot {
      margin: 4rem 0 0;
      color: var(--muted);
      font-size: .7rem;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main>
    <p class="code">Error 404</p>
    <h1>Signal lost<span>.</span></h1>
    <p class="lede">That page does not exist, or it moved. Use one of the links below to get back on track.</p>
    <nav aria-label="Recovery navigation">
      <a href="/">Home</a>
      <a href="/projects.html">Projects</a>
      <a href="/about.html">About</a>
      <a href="/contact.html">Contact</a>
    </nav>
    <p class="foot">ceonein.com</p>
  </main>
</body>
</html>
