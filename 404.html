<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found • Ceonein Dedalus</title>
  <meta name="description" content="The page you are looking for does not exist.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#080606">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link href="redesign.css" rel="stylesheet">
<style>
html,body{height:100%;margin:0;background:#080606}
body{display:grid;place-items:center;min-height:100vh;overflow:hidden;position:relative}
body::before{content:"";position:absolute;width:min(80vw,900px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(227,30,36,.45),rgba(227,30,36,.1) 45%,transparent 70%);filter:blur(20px);top:50%;left:50%;transform:translate(-50%,-50%)}
main{background:transparent!important;position:relative;z-index:2;max-width:46rem;padding:2rem;text-align:left;width:100%}
.code{font-family:var(--font-body);color:var(--color-red-bright);font-weight:600;margin:0 0 1rem}
h1{font-family:var(--font-display);font-weight:800;text-transform:uppercase;font-size:clamp(3rem,11vw,8rem);line-height:.92;letter-spacing:-.035em;margin:0 0 1.2rem;color:#fff}
h1 span{color:var(--color-red)}
.lede{color:#cfc8c7;font-size:1.1rem;max-width:30em;margin:0 0 2rem}
nav{display:flex;flex-wrap:wrap;gap:.7rem}
nav a{font-family:var(--font-body);font-weight:600;text-decoration:none;color:#fff;border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:.8em 1.5em;transition:background .3s,border-color .3s}
nav a:first-child{background:var(--color-red);border-color:var(--color-red)}
nav a:hover{background:var(--color-red-dark);border-color:var(--color-red-dark)}
.foot{margin-top:3rem;color:var(--color-muted);font-size:.85rem}
</style>
</head>
<body>
  <main>
    <p class="code">Error 404</p>
    <h1>Signal lost<span>.</span></h1>
    <p class="lede">That page does not exist, or it moved. Use one of the links below to get back on track.</p>
    <nav aria-label="Recovery navigation">
      <a href="/">Home</a>
      <a href="/projects.html">Projects</a>
      <a href="/about.html">About</a>
      <a href="/contact.html">Contact</a>
    </nav>
    <p class="foot">ceonein.com</p>
  </main>
</body>
</html>
